[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyremovebg"
version = "1.1.0"
description = "Windows-focused background removal tool with packaged executable distribution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EasyRemoveBG" }]
keywords = ["background-removal", "image-processing", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "rembg>=2.0.59,<3",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10,<7",
]

[project.scripts]
easyremovebg = "easyremovebg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
